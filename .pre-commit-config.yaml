repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Python linting - temporarily disabled for release
  # - repo: https://github.com/pycqa/flake8
  #   rev: 7.0.0
  #   hooks:
  #     - id: flake8
  #       args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  # Python type checking - temporarily disabled for release
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       args: ["--ignore-missing-imports"]

  # JavaScript/TypeScript formatting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.55.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        # pre-commit builds an ISOLATED node env from this list -- it does not
        # see frontend/node_modules. So every plugin .eslintrc.cjs references
        # must appear here, at versions compatible with eslint 8, or the hook
        # passes locally and fails in CI. That is exactly what happened:
        # react-refresh was missing while `plugins: ['react-refresh']` is
        # declared in the config.
        #
        # Versions pinned to the same majors as frontend/package.json.
        # Unpinned, CI can resolve @typescript-eslint/eslint-plugin v8, which
        # requires eslint 9 + flat config and breaks against eslint 8.
        additional_dependencies:
          - eslint@^8.57.0
          - "@typescript-eslint/parser@^6.12.0"
          - "@typescript-eslint/eslint-plugin@^6.12.0"
          - eslint-plugin-react-hooks@^4.6.0
          - eslint-plugin-react-refresh@^0.4.4

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [yaml]
        exclude: ^.*\.github/.*$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-ast
      - id: check-json
        # tsconfig files are JSONC, not JSON. TypeScript officially supports
        # comments there, and this repo uses them ("/* Bundler mode */") to
        # group options. check-json is a strict JSON parser, so it rejects a
        # file that is valid for its own format.
        #
        # Excluded rather than stripping the comments: the comments are
        # intentional documentation, tsc reads them fine, and deleting them to
        # satisfy a mis-scoped hook would be changing correct source to suit a
        # checker.
        exclude: "(^|/)tsconfig([.][^/]+)?[.]json$"

  # Security checks - temporarily disabled due to baseline issues
  # - repo: https://github.com/Yelp/detect-secrets
