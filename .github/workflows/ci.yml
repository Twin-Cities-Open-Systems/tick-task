name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  # 20, not 18: vitest declares node "^20.0.0 || ^22.0.0 || >=24.0.0", and on
  # 18 it died with "The requested module 'node:util' does not provide an
  # export named 'styleText'" -- styleText landed in Node 20.12. Node 18 is
  # also past end-of-life.
  NODE_VERSION: "20"

jobs:
  # Backend Testing
  backend_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov pytest-asyncio httpx

    - name: Run database migrations
      run: |
        python -m alembic upgrade head

    - name: Run backend tests
      run: |
        pytest tests/ -v --cov=fin_tasks --cov-report=xml --cov-report=term-missing

    - name: Test API endpoints
      run: |
        python test_api.py

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage

  # Frontend Testing
  frontend_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd frontend
        npm run test -- --coverage --run

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  # Integration Testing
  integration_test:
    runs-on: ubuntu-latest
    needs: [backend_test, frontend_test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Start backend server
      run: |
        python -m uvicorn fin_tasks.main:app --host 0.0.0.0 --port 7000 &
        sleep 5

    - name: Run API integration tests
      run: |
        python test_api.py

    - name: Test development wrapper
      run: |
        timeout 10s bash -c "./dev.py --help || true"

  # Code Quality Checks
  quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The eslint pre-commit hook builds its own node env, and without this it
    # gets the RUNNER DEFAULT (Node 24) while every other job pins 20. On 24,
    # @typescript-eslint 6.x fails to load:
    #   TypeError: Failed to load plugin '@typescript-eslint' ...
    #   Cannot read properties of undefined
    # The hook passed locally on Node 20 and failed only in CI, which is what
    # an unpinned runtime looks like.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy pre-commit

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

    - name: Check code formatting
      run: |
        black --check --diff .
        isort --check-only --diff .

    - name: Run type checking
      run: |
        mypy src/ --ignore-missing-imports

    - name: Run linting
      run: |
        flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest

    # upload-sarif writes to the code-scanning API. Without this the job runs
    # with the default read-only token and fails with
    # "Resource not accessible by integration". Scoped to exactly what the
    # step needs -- nothing else in this job writes anything.
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      # Pinned, not @master. A branch ref means this action's code can change
      # under CI with no release and no review on our side -- and this is the
      # security scanner, so an unreviewed change alters what "security scan
      # passed" means. See fleet-ops#211.
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      # v3: v1 and v2 are deprecated and CI now errors on them outright.
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
